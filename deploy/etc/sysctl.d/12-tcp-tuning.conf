# TCP tuning for traffic terminated on the router itself (clash/mihomo
# proxying; forwarded flows never see these knobs). Applied at boot by
# /etc/init.d/sysctl; apply by hand with:
#   sysctl -e -p /etc/sysctl.d/12-tcp-tuning.conf
#
# The bbr line stays LAST: without kmod-tcp-bbr it fails, and busybox
# sysctl -p (no -e) stops at the first error — anything after a failing
# line would silently not apply.

# Probe the path MTU when ICMP is blackholed (tunnels, PPPoE)
net.ipv4.tcp_mtu_probing=1

# Keep the congestion window over idle periods: clash holds long-lived
# upstream connections, without this every burst after a pause re-runs
# slow start
net.ipv4.tcp_slow_start_after_idle=0

# TCP Fast Open (client+server) deliberately NOT enabled: saves one RTT
# per handshake at best, regularly broken by middleboxes, and mihomo
# handles TFO via its own config anyway.
#net.ipv4.tcp_fastopen=3

# BBR needs kmod-tcp-bbr installed; until then this line fails with
# "No such file or directory" and the CC stays cubic. Biggest win on
# lossy uplinks (LTE), where loss != congestion.
net.ipv4.tcp_congestion_control=bbr
